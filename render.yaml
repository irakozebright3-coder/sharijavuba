# Render Blueprint: https://render.com/docs/blueprint-spec
#
# One service, one URL: this Node process serves both static apps and the API
# (backend/app.js), so the browser only ever talks to a single origin and
# CORS never comes into it.
#
# Root directory is the repository root, not backend/. The start command in
# the root package.json runs backend/server.js, and the pages are read from
# disk next to it.
#
# DATABASE_URL has no value here on purpose. `sync: false` means Render asks
# for it in the dashboard and stores it there, so the connection string never
# lands in this repo. PORT is not listed: Render assigns it and server.js
# reads it from the environment.

services:
  - type: web
    name: sharijavuba
    runtime: node
    plan: free
    # Neon is in eu-central-1, so keep the app in the same region; a
    # cross-continent hop on every query is the easiest latency to avoid.
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      # Optional: where queue events are posted for the n8n workflow. Left
      # empty, the backend skips the webhook and nothing else changes.
      - key: N8N_WEBHOOK_URL
        sync: false
