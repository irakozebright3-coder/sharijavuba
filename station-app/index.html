<!doctype html>
<html lang="rw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SharijaVuba · Sitasiyo</title>
<style>
  :root {
    --bg: #14171a;
    --panel: #1e2227;
    --panel-hi: #252a31;
    --line: #2e343b;
    --text: #e8eaed;
    --dim: #9aa3ad;
    --accent: #16a34a;
    --accent-strong: #15803d;
    --accent-press: #126c34;
    /* Lighter green for text and borders: #16a34a on the dark ground is
       below 4.5:1 for small text, this clears it comfortably. */
    --accent-text: #4ade80;
    --warn: #e0a23c;
    --warn-text: #fbbf24;
    --bad: #d9534f;
    --bad-text: #ff6b66;
    --info-text: #6bb8ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 { font-size: 20px; margin: 0; font-weight: 600; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
       color: var(--dim); margin: 28px 0 10px; font-weight: 600; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 22px 24px 40px; }

  /* --- sticky count strip ----------------------------------------------
     Pinned to the top of the viewport. The three numbers are all derived
     from the queue payload the page already polls: nothing here costs an
     extra request. */
  .strip {
    position: sticky; top: 0; z-index: 30;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    box-shadow: 0 2px 14px rgba(0, 0, 0, .45);
  }
  .strip-inner {
    max-width: 720px; margin: 0 auto; padding: 10px 24px;
    display: flex; align-items: center; gap: 22px;
  }
  .count { text-align: center; min-width: 76px; }
  .count-label {
    display: block; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .08em; color: var(--dim);
  }
  .count-num {
    display: block; font-size: 64px; line-height: 1; font-weight: 800;
    font-variant-numeric: tabular-nums;
    font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  /* Only the late number carries colour. Grey while it is zero, red the
     moment it is not, so the strip is glanceable without reading it. */
  .count-late .count-num { color: var(--dim); }
  .count-late.is-late .count-num { color: var(--bad-text); }

  #next {
    margin-left: auto; flex: 0 0 auto;
    padding: 14px 30px; font-size: 17px; font-weight: 700; letter-spacing: .05em;
    background: var(--accent); color: #fff;
    border: 0; border-radius: 8px; cursor: pointer;
  }
  #next:hover:not(:disabled) { background: var(--accent-strong); }
  #next:disabled { background: var(--line); color: var(--dim); cursor: not-allowed; }
  #next:active:not(:disabled) { background: var(--accent-press); transform: translateY(1px); }

  .topline { display: flex; align-items: center; justify-content: space-between;
             gap: 12px; margin-bottom: 18px; }
  .lang {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 9px 16px; font-size: 13px; font-weight: 600;
    cursor: pointer; letter-spacing: .04em;
  }
  .lang:hover { border-color: var(--accent-text); color: var(--accent-text); }

  .called {
    padding: 24px; border-radius: 12px;
    background: var(--panel); border: 1px solid var(--line);
    border-left: 6px solid var(--accent);
  }
  .called .label { font-size: 12px; text-transform: uppercase;
                   letter-spacing: .08em; color: var(--dim); }
  .called .plate { font-size: 46px; font-weight: 700; letter-spacing: .04em;
                   margin: 6px 0; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .called .note { color: var(--dim); font-size: 14px; }

  /* --- slow riders ----------------------------------------------------- */
  .slow-panel {
    margin-top: 26px; border-radius: 12px; overflow: hidden;
    border: 2px solid var(--bad); background: rgba(217, 83, 79, .07);
  }
  .slow-panel.is-clear { border-color: var(--line); background: transparent; }
  .slow-head {
    display: flex; align-items: baseline; gap: 12px;
    padding: 14px 18px; background: rgba(217, 83, 79, .16);
    border-bottom: 1px solid rgba(217, 83, 79, .35);
  }
  .slow-panel.is-clear .slow-head { background: transparent; border-bottom-color: var(--line); }
  .slow-title {
    font-size: 16px; font-weight: 800; letter-spacing: .1em;
    text-transform: uppercase; color: var(--bad-text);
  }
  .slow-panel.is-clear .slow-title { color: var(--dim); }
  .slow-sub { font-size: 12px; color: var(--dim); margin-left: auto; }
  .slow-row {
    display: flex; align-items: center; gap: 16px;
    padding: 16px 18px; border-bottom: 1px solid rgba(217, 83, 79, .22);
    border-left: 6px solid var(--warn);
  }
  .slow-row:last-child { border-bottom: 0; }
  .slow-row.critical { border-left-color: var(--bad); background: rgba(217, 83, 79, .12); }
  .slow-plate {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 26px; font-weight: 700; letter-spacing: .03em; flex: 1 1 auto;
  }
  .slow-mins { font-size: 30px; font-weight: 800; line-height: 1; color: var(--warn-text); }
  .slow-row.critical .slow-mins { color: var(--bad-text); }
  .slow-mins-unit {
    display: block; font-size: 11px; font-weight: 600; text-align: right;
    text-transform: uppercase; letter-spacing: .06em; color: var(--dim);
  }
  .slow-clear { padding: 16px 18px; color: var(--dim); font-size: 14px; }

  /* --- battery rack ---------------------------------------------------- */
  .rack {
    margin-top: 26px; padding: 14px 18px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; border-left: 4px solid var(--accent);
    display: flex; align-items: center; gap: 16px;
  }
  .rack-label { font-size: 12px; text-transform: uppercase;
                letter-spacing: .08em; color: var(--dim); flex: 1 1 auto; }
  .rack-count {
    font-size: 34px; font-weight: 700; line-height: 1;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    min-width: 62px; text-align: right;
  }
  .rack-btn {
    width: 46px; height: 46px; flex: 0 0 auto;
    font-size: 24px; font-weight: 700; line-height: 1;
    background: var(--panel-hi); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; cursor: pointer;
  }
  .rack-btn:hover:not(:disabled) { border-color: var(--accent-text); color: var(--accent-text); }
  .rack-btn:active:not(:disabled) { transform: translateY(1px); }
  .rack-btn:disabled { opacity: .4; cursor: not-allowed; }

  /* --- collapsed picker section ---------------------------------------- */
  .picker-section {
    margin-top: 26px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px;
  }
  .picker-section > summary {
    padding: 14px 18px; cursor: pointer; list-style: none;
    font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--dim); font-weight: 600;
    display: flex; align-items: center; gap: 10px;
  }
  .picker-section > summary::-webkit-details-marker { display: none; }
  .picker-section > summary::before {
    content: "\25B8"; color: var(--dim); font-size: 14px;
    transition: transform .12s ease;
  }
  .picker-section[open] > summary::before { transform: rotate(90deg); }
  .picker-section > summary:hover { color: var(--accent-text); }
  .pickers { display: flex; gap: 14px; flex-wrap: wrap; padding: 0 18px 18px; }
  select {
    flex: 1 1 200px; padding: 13px 14px; font-size: 16px;
    background: var(--panel-hi); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px;
  }

  /* --- tables ----------------------------------------------------------- */
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left; font-size: 12px; text-transform: uppercase;
    letter-spacing: .06em; color: var(--dim); font-weight: 600;
    padding: 8px 10px; border-bottom: 1px solid var(--line);
  }
  td { padding: 14px 10px; border-bottom: 1px solid var(--line); }

  /* Status colour runs down the left edge and tints the row: white for
     waiting, yellow for called, green for arrived. */
  tr.st-waiting td:first-child { box-shadow: inset 4px 0 0 #cfd6dd; }
  tr.st-called  td { background: rgba(224, 162, 60, .12); }
  tr.st-called  td:first-child { box-shadow: inset 4px 0 0 var(--warn); }
  tr.st-arrived td { background: rgba(22, 163, 74, .14); }
  tr.st-arrived td:first-child { box-shadow: inset 4px 0 0 var(--accent-text); }

  .plate-cell { font-family: ui-monospace, Menlo, Consolas, monospace;
                font-size: 17px; letter-spacing: .03em; }
  .pos { color: var(--dim); width: 40px; }

  .tag {
    display: inline-block; padding: 2px 8px; border-radius: 20px;
    font-size: 12px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .04em; border: 1px solid var(--line); color: var(--dim);
  }
  .tag.called { color: var(--warn-text); border-color: var(--warn-text); }
  .tag.arrived { color: var(--info-text); border-color: var(--info-text); }
  .tag.no_show { color: var(--bad); border-color: var(--bad); }
  .tag.served { color: var(--accent-text); border-color: var(--accent-text); }
  .slip { color: var(--warn); font-size: 12px; margin-left: 6px; }

  .serve {
    background: var(--accent-strong); color: #fff; border: 0;
    border-radius: 8px; padding: 11px 20px; font-size: 14px;
    font-weight: 700; letter-spacing: .04em; cursor: pointer;
  }
  .serve:hover { background: var(--accent-press); }
  .serve:active { background: var(--accent-press); transform: translateY(1px); }
  .serve[disabled] { opacity: .5; cursor: not-allowed; }

  .empty { color: var(--dim); padding: 16px 10px; }
  .recent td { opacity: .6; }
  #error {
    margin-bottom: 18px; padding: 12px; border-radius: 6px;
    background: rgba(217, 83, 79, .12); border: 1px solid var(--bad);
    color: #ffb3b0; font-size: 14px;
  }
  .foot { margin-top: 28px; color: var(--dim); font-size: 12px; }

  @media (max-width: 560px) {
    .wrap { padding: 18px 14px 32px; }
    .strip-inner { padding: 8px 14px; gap: 12px; }
    .count { min-width: 54px; }
    .count-num { font-size: 40px; }
    #next { padding: 12px 18px; font-size: 15px; }
    .slow-plate { font-size: 21px; }
    .slow-mins { font-size: 24px; }
  }
</style>
</head>
<body>

<!-- Always visible while scrolling. Every number here comes from the queue
     payload the page already polls; there is no second request. -->
<div class="strip">
  <div class="strip-inner">
    <div class="count">
      <span class="count-label" data-i18n="station.countWaiting">waiting</span>
      <span class="count-num" id="countWaiting">0</span>
    </div>
    <div class="count">
      <span class="count-label" data-i18n="station.countComing">coming</span>
      <span class="count-num" id="countComing">0</span>
    </div>
    <div class="count count-late" id="countLateBox">
      <span class="count-label" data-i18n="station.countLate">late</span>
      <span class="count-num" id="countLate">0</span>
    </div>
    <button id="next" type="button" disabled data-i18n="station.next">NEXT</button>
  </div>
</div>

<div class="wrap">
  <div class="topline">
    <h1>SharijaVuba &middot; <span data-i18n="station.title">Station</span></h1>
    <button id="lang" class="lang" type="button">EN</button>
  </div>

  <div id="error" hidden></div>

  <div id="called" class="called" hidden>
    <div class="label" data-i18n="station.nowCalling">Now calling</div>
    <div class="plate" id="calledPlate">--</div>
    <div class="note" id="calledNote"></div>
  </div>

  <h2 data-i18n="station.queue">Queue</h2>
  <table>
    <thead>
      <tr><th class="pos">#</th><th data-i18n="station.colPlate">Plate</th><th data-i18n="station.colStatus">Status</th><th data-i18n="station.colPosition">Position</th><th data-i18n="station.colAction">Action</th></tr>
    </thead>
    <tbody id="queue"></tbody>
  </table>

  <div class="slow-panel" id="slowPanel">
    <div class="slow-head">
      <span class="slow-title" data-i18n="station.slowRiders">SLOW RIDERS</span>
      <span class="slow-sub" id="slowSub"></span>
    </div>
    <div id="slowList"></div>
  </div>

  <h2 data-i18n="station.justLeft">Just left the queue</h2>
  <table>
    <thead>
      <tr><th class="pos"></th><th data-i18n="station.colPlate">Plate</th><th data-i18n="station.colStatus">Status</th><th data-i18n="station.colPosition">Position</th></tr>
    </thead>
    <tbody id="recent" class="recent"></tbody>
  </table>

  <div class="rack">
    <span class="rack-label" data-i18n="station.batteriesAvailable">Batteries available</span>
    <button id="rackMinus" class="rack-btn" type="button" data-i18n-aria="station.ariaOneFewer" aria-label="One fewer battery" disabled>&minus;</button>
    <span class="rack-count" id="rackCount">--</span>
    <button id="rackPlus" class="rack-btn" type="button" data-i18n-aria="station.ariaOneMore" aria-label="One more battery" disabled>+</button>
  </div>

  <!-- Closed on load; the open/closed choice is remembered per device.
       Once a station is picked it rarely changes during a shift, so this
       is the one thing on the page worth folding away. -->
  <details class="picker-section" id="pickerSection">
    <summary data-i18n="station.pickerSection">Station and battery type</summary>
    <div class="pickers">
      <select id="station"><option data-i18n="station.loadingStations">Loading stations...</option></select>
      <select id="battery"></select>
    </div>
  </details>

  <div class="foot" id="foot" data-i18n="station.notPolling">Not polling yet.</div>
</div>

<script src="../strings.rw.js"></script>
<script>
// Where the API lives. Defaults to the deployed instance, the same choice
// ussd/ussd.mjs already makes, so this file works opened straight from disk
// with nothing running locally.
//
// For a local backend, open the page as:
//   index.html?api=http://localhost:3000
const API = (new URLSearchParams(location.search).get('api')
  || (location.hostname === 'localhost' || location.hostname === '127.0.0.1'
    ? 'http://localhost:3000'
    : 'https://sharijavuba-backend.onrender.com')).replace(/\/+$/, '');
const POLL_MS = 3000;

// localStorage throws outright on some origins (file:// under a strict
// browser, private windows). Every read and write goes through these so a
// storage failure costs a remembered preference, not the whole page.
function readStored(key) {
  try { return localStorage.getItem(key); } catch (err) { return null; }
}
function writeStored(key, value) {
  try { localStorage.setItem(key, value); } catch (err) { /* not fatal */ }
}

// --- language ---------------------------------------------------------
// Strings come from the generated strings.rw.js. Anything without an entry
// falls back to the English already written into the markup and the code,
// so a missing translation degrades to English rather than to a blank.
const STRINGS = window.SHARIJAVUBA_STRINGS || {};
let lang = readStored('sharijavuba.lang') || 'rw';

function t(id, english) {
  const entry = STRINGS[id];
  if (lang === 'rw' && entry && entry.rw) return entry.rw;
  if (english !== undefined) return english;
  return entry ? entry.en : id;
}

// Remember each element's original English once, so switching back is exact.
function applyLanguage() {
  for (const el of document.querySelectorAll('[data-i18n]')) {
    if (el.dataset.en === undefined) el.dataset.en = el.textContent;
    el.textContent = t(el.dataset.i18n, el.dataset.en);
  }
  // Same treatment for labels that are read aloud but never displayed.
  for (const el of document.querySelectorAll('[data-i18n-aria]')) {
    if (el.dataset.ariaEn === undefined) el.dataset.ariaEn = el.getAttribute('aria-label') || '';
    el.setAttribute('aria-label', t(el.dataset.i18nAria, el.dataset.ariaEn));
  }
  document.documentElement.lang = lang;
  document.title = 'SharijaVuba · ' + t('station.title', 'Station');
  const btn = document.getElementById('lang');
  if (btn) btn.textContent = lang === 'rw' ? 'EN' : 'RW';
  // Battery types are data, not markup, so their labels are rebuilt rather
  // than swapped in place.
  renderBatteryOptions();
}

function statusLabel(status) {
  return t('status.' + status, String(status).replace('_', ' '));
}

const $ = (id) => document.getElementById(id);
const stationSel = $('station');
const batterySel = $('battery');

// The claim we last pressed NEXT for. Kept so the banner can follow it: if
// the sweep slips it back or marks it no_show, that shows up here without
// the attendant doing anything.
let calledClaimId = null;

// batteries_available per station id, seeded from /stations and corrected
// by whatever PATCH returns. The queue never changes this number, so there
// is nothing to re-read on the ordinary poll.
let stationBatteries = {};
let rackBusy = false;

// The battery types offered by the picker, kept so a language switch can
// relabel them without another request.
let batteryTypes = [];

function showError(message) {
  $('error').hidden = !message;
  $('error').textContent = message || '';
}

async function api(path, options) {
  const res = await fetch(API + path, options);
  if (res.status === 204) return null;
  const body = await res.json().catch(() => null);
  if (!res.ok) throw new Error((body && body.error) || ('HTTP ' + res.status));
  return body;
}

function tag(status) {
  return '<span class="tag ' + status + '">' + statusLabel(status) + '</span>';
}

function row(claim, index, withAction) {
  const slip = claim.slip_count > 0 ? '<span class="slip">' + t('station.slippedOnce', 'slipped once') + '</span>' : '';

  // A claim only becomes servable once the rider has checked in. Without
  // this button an arrived rider has no way out of the queue.
  const action = !withAction ? '' :
    '<td>' + (claim.status === 'arrived'
      ? '<button class="serve" data-serve="' + claim.claim_id + '">' + t('station.serve', 'SERVE') + '</button>'
      : '') + '</td>';

  return '<tr class="st-' + claim.status + '">' +
    '<td class="pos">' + (index === null ? '' : index + 1) + '</td>' +
    '<td class="plate-cell">' + claim.plate_number + slip + '</td>' +
    '<td>' + tag(claim.status) + '</td>' +
    '<td class="pos">' + claim.position + '</td>' +
    action +
    '</tr>';
}

// battery_type is free text with no reference table, so the value is data.
// The label goes through the same i18n path as everything else and falls
// back to the raw value for a type nobody has translated yet.
function renderBatteryOptions() {
  if (!batteryTypes.length) return;
  const chosen = batterySel.value;
  batterySel.innerHTML = batteryTypes
    .map((type) => '<option value="' + type + '">' + t('battery.' + type, type) + '</option>')
    .join('');
  if (chosen && batteryTypes.includes(chosen)) batterySel.value = chosen;
}

function renderCalled(queue, recent) {
  if (!calledClaimId) return;
  const claim = queue.concat(recent).find((c) => c.claim_id === calledClaimId);
  if (!claim) return; // aged out of both lists; leave the last plate showing

  $('calledPlate').textContent = claim.plate_number;
  const note = {
    called: t('station.noteCalled', 'Waiting for the rider to arrive.'),
    arrived: t('station.noteArrived', 'Rider has arrived at the station.'),
    waiting: t('station.noteWaiting', 'Slipped back into the queue, grace window expired.'),
    no_show: t('station.noteNoShow', 'Marked no-show by the sweep.'),
    served: t('station.noteServed', 'Swap confirmed.'),
    released: t('station.noteReleased', 'Rider released this slot.'),
  }[claim.status] || '';
  $('calledNote').textContent = note;
  $('called').hidden = false;
}

// Called riders who have not arrived yet. The backend decides who counts;
// this only decides how loud each one looks. Twice the threshold reads as
// critical, because at that point the sweep is closer than the rider is.
function renderSlow(slow, threshold) {
  const minutes = threshold || 3;
  $('slowSub').textContent =
    t('station.slowSub', 'Called, still not here · {min}+ min').replace('{min}', minutes);

  if (!slow || !slow.length) {
    $('slowList').innerHTML = '<div class="slow-clear">' +
      t('station.slowNone', 'Nobody is overdue. Everyone called has turned up.') + '</div>';
    $('slowPanel').classList.add('is-clear');
    return;
  }

  $('slowPanel').classList.remove('is-clear');
  $('slowList').innerHTML = slow.map((c) => {
    const mins = c.minutes_since_called;
    const critical = mins >= minutes * 2 ? ' critical' : '';
    return '<div class="slow-row' + critical + '">' +
      '<span class="slow-plate">' + c.plate_number + '</span>' +
      '<span><span class="slow-mins">' + mins + '</span>' +
      '<span class="slow-mins-unit">' + t('station.minWaiting', 'min waiting') + '</span></span>' +
      '</div>';
  }).join('');
}

// All three come out of the one queue payload: waiting and coming are
// counted off the rows, late is the length of the same list the panel
// below is built from, so the strip and the panel can never disagree.
function renderCounts(queue, slow) {
  const waiting = queue.filter((c) => c.status === 'waiting').length;
  const coming = queue.filter((c) => c.status === 'called' || c.status === 'arrived').length;
  const late = (slow || []).length;

  $('countWaiting').textContent = waiting;
  $('countComing').textContent = coming;
  $('countLate').textContent = late;
  $('countLateBox').classList.toggle('is-late', late > 0);
}

function renderRack(stationId) {
  const count = stationBatteries[stationId];
  const known = count !== undefined && count !== null;
  $('rackCount').textContent = known ? count : '--';
  $('rackMinus').disabled = rackBusy || !known || count <= 0;
  $('rackPlus').disabled = rackBusy || !known;
}

// Sends the value it wants, not a delta, so two attendants tapping at once
// land on a number one of them chose rather than on the sum of both taps.
async function adjustBatteries(delta) {
  const stationId = stationSel.value;
  const current = stationBatteries[stationId];
  if (!stationId || current === undefined || current === null) return;

  const next = Math.max(0, current + delta);
  if (next === current) return;

  rackBusy = true;
  renderRack(stationId);
  try {
    const station = await api('/stations/' + stationId, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ batteries_available: next }),
    });
    stationBatteries[stationId] = station.batteries_available;
    showError('');
  } catch (err) {
    showError(t('station.errBatteryUpdate', 'Could not update the battery count.') + ' ' + err.message);
  }
  rackBusy = false;
  renderRack(stationId);
}

async function refresh() {
  const stationId = stationSel.value;
  const batteryType = batterySel.value;
  if (!stationId || !batteryType) return;

  try {
    const data = await api('/stations/' + stationId + '/queue?battery_type=' +
      encodeURIComponent(batteryType));
    showError('');

    $('queue').innerHTML = data.queue.length
      ? data.queue.map((c, i) => row(c, i, true)).join('')
      : '<tr><td colspan="5" class="empty">' + t('station.nobodyWaiting', 'Nobody waiting.') + '</td></tr>';

    $('recent').innerHTML = data.recent.length
      ? data.recent.map((c) => row(c, null, false)).join('')
      : '<tr><td colspan="4" class="empty">' + t('station.nothingYet', 'Nothing yet.') + '</td></tr>';

    renderSlow(data.slow, data.slow_threshold_minutes);
    renderCounts(data.queue, data.slow);
    renderCalled(data.queue, data.recent);

    // The queue response carries the rack count, so a serve-time decrement
    // or another attendant's adjustment lands here within one poll. Skipped
    // while a PATCH of our own is in flight, so the poll cannot flicker back
    // to the pre-tap value between the request and its answer.
    if (!rackBusy && data.batteries_available !== undefined && data.batteries_available !== null) {
      stationBatteries[stationId] = data.batteries_available;
      renderRack(stationId);
    }

    $('next').disabled = false;
    $('foot').textContent = t('station.updated', 'Updated') + ' ' + new Date().toLocaleTimeString();
  } catch (err) {
    showError(t('station.errQueueLoad', 'Could not load the queue.') + ' ' + err.message);
    $('foot').textContent = t('station.lastAttemptFailed', 'Last attempt failed at') + ' ' + new Date().toLocaleTimeString();
  }
}

async function pressNext() {
  const stationId = stationSel.value;
  const batteryType = batterySel.value;
  $('next').disabled = true;
  try {
    const claim = await api('/stations/' + stationId + '/next', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ battery_type: batteryType }),
    });

    if (!claim) {
      // 204: nothing eligible was waiting, or another attendant won the race.
      calledClaimId = null;
      $('calledPlate').textContent = '--';
      $('calledNote').textContent = t('station.nobodyForBattery', 'Nobody was waiting for that battery type.');
      $('called').hidden = false;
    } else {
      // This endpoint returns the claim bare, not wrapped in { claim }.
      calledClaimId = claim.claim_id;
      $('calledPlate').textContent = claim.plate_number;
      $('calledNote').textContent = t('station.noteCalled', 'Waiting for the rider to arrive.');
      $('called').hidden = false;
    }
    showError('');
  } catch (err) {
    showError(t('station.errNextFailed', 'NEXT failed.') + ' ' + err.message);
  }
  refresh();
}

async function init() {
  try {
    const stations = await api('/stations');
    if (!stations.length) {
      stationSel.innerHTML = '<option value="">' + t('station.noStationsOption', 'No stations in the database') + '</option>';
      showError(t('station.noStationsError', 'No stations exist yet. Add one first.'));
      return;
    }
    stationSel.innerHTML = stations
      .map((s) => '<option value="' + s.id + '">' + s.name + '</option>')
      .join('');

    // Restore the station chosen last time, but only if it still exists;
    // a deleted station must not leave the picker pointing at nothing.
    const savedStation = readStored('sharijavuba.station');
    if (savedStation && stations.some((s) => s.id === savedStation)) {
      stationSel.value = savedStation;
    }

    stationBatteries = {};
    for (const s of stations) stationBatteries[s.id] = s.batteries_available;
    renderRack(stationSel.value);

    // battery_type is free text with no reference table, so the picker can
    // only offer what has actually been used. 'standard' is there so a fresh
    // database still gives you something to select.
    const used = await api('/battery-types');
    batteryTypes = used.includes('standard') ? used : ['standard'].concat(used);
    renderBatteryOptions();

    const savedBattery = readStored('sharijavuba.battery');
    if (savedBattery && batteryTypes.includes(savedBattery)) {
      batterySel.value = savedBattery;
    }

    refresh();
    setInterval(refresh, POLL_MS);
  } catch (err) {
    showError(t('station.errApiUnreachable', 'Could not reach the server.') + ' ' + API + ' (' + err.message + ')');
  }
}

stationSel.addEventListener('change', () => {
  writeStored('sharijavuba.station', stationSel.value);
  calledClaimId = null;
  $('called').hidden = true;
  renderRack(stationSel.value);
  refresh();
});
batterySel.addEventListener('change', () => {
  writeStored('sharijavuba.battery', batterySel.value);
  calledClaimId = null;
  $('called').hidden = true;
  refresh();
});
$('next').addEventListener('click', pressNext);
$('rackMinus').addEventListener('click', () => adjustBatteries(-1));
$('rackPlus').addEventListener('click', () => adjustBatteries(1));

// Closed on load unless this device left it open last time.
const pickerSection = $('pickerSection');
pickerSection.open = readStored('sharijavuba.pickerOpen') === '1';
pickerSection.addEventListener('toggle', () => {
  writeStored('sharijavuba.pickerOpen', pickerSection.open ? '1' : '0');
});

// Delegated, because the table is rebuilt from scratch on every poll.
$('queue').addEventListener('click', async (event) => {
  const button = event.target.closest('[data-serve]');
  if (!button) return;

  button.disabled = true;
  try {
    await api('/claims/' + button.dataset.serve + '/served', { method: 'POST' });
    showError('');
  } catch (err) {
    showError(t('station.errServeFailed', 'SERVE did not work.') + ' ' + err.message);
    button.disabled = false;
  }
  refresh();
});

$('lang').addEventListener('click', () => {
  lang = lang === 'rw' ? 'en' : 'rw';
  writeStored('sharijavuba.lang', lang);
  applyLanguage();
  refresh();
});

applyLanguage();

init();
</script>
</body>
</html>
